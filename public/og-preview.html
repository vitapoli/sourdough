<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  .card {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #FDF8F3 0%, #F0E4D7 50%, #E8D5C0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 60px 80px;
    position: relative;
    overflow: hidden;
  }

  /* Декоративные круги на фоне */
  .card::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(212,118,58,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  .card::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(232,168,56,0.1) 0%, transparent 70%);
    border-radius: 50%;
  }

  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 1;
    padding-right: 0;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .logo-dot {
    width: 14px;
    height: 14px;
    background: #D4763A;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .logo-text {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 28px;
    color: #5C4033;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .title {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 54px;
    line-height: 1.15;
    color: #3D2C1E;
    margin-bottom: 20px;
  }

  .title span {
    color: #D4763A;
  }

  .subtitle {
    font-size: 22px;
    line-height: 1.5;
    color: #8B7355;
    font-weight: 500;
    max-width: 460px;
  }

  .features {
    display: flex;
    gap: 20px;
    margin-top: 32px;
  }

  .feature {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.7);
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #5C4033;
    box-shadow: 0 2px 8px rgba(61,44,30,0.06);
  }

  .feature-icon {
    font-size: 20px;
    display: inline-flex;
    align-items: center;
    color: #D4763A;
  }

  .right {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    position: relative;
  }

  .jar-wrapper {
    width: 320px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .jar-glow {
    position: absolute;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, rgba(212,118,58,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }

  .jar-img {
    width: 280px;
    height: 280px;
    object-fit: contain;
    position: relative;
    z-index: 1;
    filter: drop-shadow(0 8px 24px rgba(61,44,30,0.15));
  }

  /* Декоративные пузырьки вокруг баночки */

</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="logo-row">
        <div class="logo-dot"></div>
        <div class="logo-text">Sourdough</div>
      </div>
      <h1 class="title">Живая закваска —<br><span>умный трекер</span></h1>
      <p class="subtitle">Первое русскоязычное приложение для домашних пекарей</p>
      <div class="features">
        <div class="feature">
          <span class="feature-icon">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="10" y="4" width="12" height="4" rx="2"/>
              <path d="M11 8 v2 M21 8 v2"/>
              <path d="M9 10 h14 c1 0 2 1 2 2 v14 c0 2-1 3-3 3 H10 c-2 0-3-1-3-3 V12 c0-1 1-2 2-2z"/>
              <circle cx="13" cy="20" r="1.5" fill="currentColor" opacity="0.3" stroke="none"/>
              <circle cx="18" cy="22" r="1" fill="currentColor" opacity="0.25" stroke="none"/>
              <circle cx="15" cy="17" r="1" fill="currentColor" opacity="0.2" stroke="none"/>
            </svg>
          </span>
          Трекер
        </div>
        <div class="feature">
          <span class="feature-icon">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 4h12l6 6v18a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V4z"/>
              <path d="M19 4v6h6"/>
              <path d="M11 14h10" opacity="0.6"/>
              <path d="M11 18h10" opacity="0.6"/>
              <path d="M11 22h6" opacity="0.4"/>
            </svg>
          </span>
          Рецепты
        </div>
        <div class="feature">
          <span class="feature-icon">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="7" y="4" width="18" height="24" rx="2"/>
              <rect x="10" y="7" width="12" height="5" rx="1" opacity="0.3" fill="currentColor" stroke="none"/>
              <rect x="10" y="15" width="3" height="3" rx="0.5"/>
              <rect x="14.5" y="15" width="3" height="3" rx="0.5"/>
              <rect x="19" y="15" width="3" height="3" rx="0.5"/>
              <rect x="10" y="21" width="3" height="3" rx="0.5"/>
              <rect x="14.5" y="21" width="3" height="3" rx="0.5"/>
              <rect x="19" y="21" width="3" height="3" rx="0.5"/>
            </svg>
          </span>
          Калькулятор
        </div>
      </div>
    </div>
    <div class="right">
      <div class="jar-wrapper">
        <div class="jar-glow"></div>
        <img class="jar-img" src="og-jar.png" alt="Счастливая закваска">
      </div>
    </div>
  </div>
</body>
</html>
