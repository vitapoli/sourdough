name: Levain Lab — посты из дока

# Почасовое расписание перенесено на cron сервера levainlab.ru — оно надёжнее.
# GitHub Actions на бесплатном тарифе часто опаздывал на десятки минут или вовсе
# пропускал прогоны под нагрузкой, из-за чего посты выходили с опозданием.
#
# ВНИМАНИЕ: «вживую» бот теперь работает на сервере, и его память (какие посты уже
# опубликованы) хранится ТАМ, в content/*.json. Этот ручной запуск читает состояние
# из git — оно может разойтись с сервером и привести к повторной публикации.
# Поэтому штатно им не пользуемся. Если сервер упадёт — запасной вариант это запустить
# скрипт на самом сервере (см. scripts/publish-cron.sh), а не отсюда.
on:
  workflow_dispatch:

permissions:
  contents: write

# не запускать два прогона одновременно — иначе можно задвоить публикацию
concurrency:
  group: levain-scheduled
  cancel-in-progress: false

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Создать файл секретов
        run: |
          mkdir -p ~/.secrets
          printf "TG_BOT_TOKEN=%s\nTG_CHANNEL_ID=%s\nTG_ADMIN_CHAT_ID=%s\n" \
            "${{ secrets.TG_BOT_TOKEN }}" \
            "${{ secrets.TG_CHANNEL_ID }}" \
            "${{ secrets.TG_ADMIN_CHAT_ID }}" \
            > ~/.secrets/sourdough-tokens

      - name: Опубликовать по расписанию / собрать посты из дока
        run: node scripts/publish-post.mjs --scheduled

      - name: Сохранить очередь в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f content/scheduled-posts.json content/bot-state.json
          if git diff --staged --quiet; then echo "изменений нет"; exit 0; fi
          git commit -m "очередь постов: обновление состояния"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "повтор push ($i)"; sleep 5
          done
          echo "push не удался"; exit 1
